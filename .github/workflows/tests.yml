name: Synthetic tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic:
    name: synthetic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run synthetic tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline synthetic tests
        working-directory: offline
        run: python -m unittest discover -s tests -v
      - name: Run sensor and dashboard synthetic tests
        run: python -m unittest discover -s telemetry -p 'test_*.py' -v
      - name: Run mocked hardware tests
        shell: pwsh
        run: ./telemetry/Test-Hardware.ps1
